// ── Default content (shown before any fetch, avoids "加载中") ──
const DEFAULT = `# 泰深输入法

> Rust 核心引擎 + C++ TSF 平台层 · 跨平台中文拼音输入法

## 项目状态

| 阶段 | 进度 |
|------|------|
| 架构设计 | ✅ ARCHITECT.md — 拓扑 + 11 Root |
| 开发环境 | ✅ L2 宪法 + Biome + EditorConfig |
| 竞品调研 | ✅ RIME/PIME/Skia 分析 |
| 词库模块 | ✅ SQLite 加载 + 203 条词库 |
| TSF 平台层 | ⏳ 下一个模块 |

## 文档导航

点击左侧菜单浏览各文档。如果页面显示异常，请通过以下方式打开：

- **泰深画布**：在泰深中通过 HTML 画布打开（自动提供 HTTP 服务）
- **本地服务器**：\`cd docs && python -m http.server 8080\`，然后访问 \`http://localhost:8080/index.html\`
`;

async function loadMD(path) {
  document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
  const links = document.querySelectorAll('nav a[onclick]');
  for (const a of links) {
    if (a.getAttribute('onclick').includes(path)) a.classList.add('active');
  }

  try {
    const resp = await fetch(path);
    if (!resp.ok) throw new Error('fetch failed');
    const md = await resp.text();
    document.getElementById('content').innerHTML = marked.parse(md);
  } catch {
    document.getElementById('content').innerHTML = marked.parse(DEFAULT);
  }
}

function navigate(event, path) {
  event.preventDefault();
  loadMD(path);
}

// 初始加载
loadMD('ARCHITECT.md');
