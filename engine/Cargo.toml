[package]
name = "taishen_engine"
version = "0.1.90"
edition = "2024"
description = "泰深输入法核心引擎 — 拼音处理与词库查询"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "taishen_engine"

[features]
default = []
sentence_legacy = []

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
# 0.2.29 词库预编译索引：部署期把系统词库序列化为 .bin，运行时秒加载
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
# V0.5 语音输入 JSON 解析（HTTP 请求直接使用标准库 std::net::TcpStream）
serde_json = "1"
# 词库索引零拷贝加载：把 .bin 直接映射进地址空间，查询时用 &str 指向映射区
memmap2 = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1