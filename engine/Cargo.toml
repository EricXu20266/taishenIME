[package]
name = "taishen_engine"
version = "0.1.0"
edition = "2024"
description = "泰深输入法核心引擎 — 拼音处理与词库查询"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "taishen_engine"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
# 0.2.29 词库预编译索引：部署期把系统词库序列化为 .bin，运行时秒加载
serde = { version = "1", features = ["derive"] }
bincode = "1.3"